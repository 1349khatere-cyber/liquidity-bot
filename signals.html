<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Liquidity Hunter — ICT Conditional Signals</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;900&display=swap');
        body { font-family: 'Vazirmatn', sans-serif; background-color: #0b1120; color: #f8fafc; -webkit-tap-highlight-color: transparent; }
        .glass-panel { background: rgba(30, 41, 59, 0.6); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.08); box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3); }
        .neon-border-green { border-color: rgba(16, 185, 129, 0.5); box-shadow: 0 0 15px rgba(16, 185, 129, 0.2); }
        .neon-border-red { border-color: rgba(239, 68, 68, 0.5); box-shadow: 0 0 15px rgba(239, 68, 68, 0.2); }
        .neon-border-yellow { border-color: rgba(245, 158, 11, 0.5); box-shadow: 0 0 15px rgba(245, 158, 11, 0.2); }
        .glow-text-green { text-shadow: 0 0 10px rgba(16, 185, 129, 0.8); }
        .glow-text-red { text-shadow: 0 0 10px rgba(239, 68, 68, 0.8); }
        @keyframes pulse-glow {
            0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(16, 185, 129, 0); }
            100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }
        .animate-pulse-green { animation: pulse-glow 2s infinite; }
        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="min-h-screen p-3 pb-10">
    <div class="max-w-md mx-auto space-y-5">
        
        <!-- هدر -->
        <div class="flex flex-col items-center justify-center glass-panel rounded-3xl p-6 relative overflow-hidden">
            <div class="absolute -top-10 -right-10 w-40 h-40 bg-blue-500/20 rounded-full blur-3xl"></div>
            <div class="absolute -bottom-10 -left-10 w-40 h-40 bg-purple-500/20 rounded-full blur-3xl"></div>
            <div class="w-14 h-14 rounded-2xl bg-gradient-to-br from-blue-500 to-indigo-600 flex items-center justify-center text-2xl font-black text-white mb-3 shadow-lg">LH</div>
            <h1 class="text-2xl font-black text-white glow-text">سیگنال‌های شرطی ICT</h1>
            <p class="text-xs text-gray-400 mb-4">ستاپ‌های ساخته‌شده بر اساس سطوح ساختاری (Limit Orders)</p>
            <div class="flex items-center gap-2 w-full z-10">
                <span id="status-badge" class="flex-1 py-2 rounded-xl bg-gray-800/80 text-xs font-bold border border-gray-700 text-center">در حال اتصال...</span>
                <button onclick="manualRefresh()" class="flex-1 bg-blue-600 hover:bg-blue-500 py-2 rounded-xl text-xs font-bold transition shadow-lg">بروزرسانی</button>
            </div>
            <div id="countdown-text" class="text-[10px] text-emerald-400 mt-3 flex items-center justify-center gap-1 font-bold">
                <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span>
                <span>به‌روزرسانی در 30 ثانیه</span>
            </div>
        </div>

        <!-- کارت‌ها -->
        <div id="cards-container" class="space-y-6"></div>

    </div>

    <script>
        const API_URL = 'https://liquidity-bot-khaki.vercel.app/api/market-status';
        let countdown = 30;
        let timerInterval = null;

        function startCountdown() {
            if (timerInterval) clearInterval(timerInterval);
            countdown = 30;
            updateCountdownUI();
            timerInterval = setInterval(() => {
                countdown--;
                updateCountdownUI();
                if (countdown <= 0) { fetchAllData(); countdown = 30; }
            }, 1000);
        }

        function updateCountdownUI() {
            const el = document.getElementById('countdown-text');
            if (el) {
                el.innerHTML = `<span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span> به‌روزرسانی در ${countdown} ثانیه`;
            }
        }

        function manualRefresh() { fetchAllData(); startCountdown(); }

        function calculateQualityScore(item) {
            let score = 0;
            const adv = item.advanced;
            if (adv.verdict.includes('قوی')) score += 1000;
            else if (adv.verdict.includes('تله')) score += 500;
            if (adv.trend1h === '🟢') score += 15;
            if (adv.trend4h === '🟢') score += 15;
            if (adv.takerRatio > 55) score += 20;
            if (adv.topTrader > 55) score += 20;
            if (adv.oiDivergence === 'همسو') score += 10;
            if (adv.isOTE.includes('بله')) score += 10;
            if (adv.hasOB.includes('تایید')) score += 10;
            if (adv.adx > 25) score += 10;
            return score;
        }

        async function fetchAllData() {
            const badge = document.getElementById('status-badge');
            badge.innerText = 'در حال بروزرسانی...';
            badge.className = 'flex-1 py-2 rounded-xl bg-gray-800 text-xs font-bold border border-gray-700 text-center';
            try {
                const res = await fetch(API_URL);
                const json = await res.json();
                if (json.ok) {
                    const sortedData = json.data.sort((a, b) => calculateQualityScore(b) - calculateQualityScore(a));
                    renderCards(sortedData);
                    badge.className = 'flex-1 py-2 rounded-xl bg-emerald-900/50 text-emerald-300 text-xs font-bold border border-emerald-500/50 text-center';
                    badge.innerText = 'متصل (Live)';
                }
            } catch (e) {
                badge.className = 'flex-1 py-2 rounded-xl bg-red-900/50 text-red-300 text-xs font-bold border border-red-500/50 text-center';
                badge.innerText = 'خطا در اتصال';
            }
        }

        function renderCards(data) {
            const container = document.getElementById('cards-container');
            container.innerHTML = '';
            
            data.forEach((item, index) => {
                const adv = item.advanced;
                const rank = index + 1;
                const qualityScore = calculateQualityScore(item);
                const maxScore = 1100; 
                const displayScore = Math.min(100, Math.round((qualityScore / maxScore) * 100));

                let cardBorder = 'neon-border-yellow';
                let bgGradient = 'from-gray-800/80 to-gray-900/80';
                let iconHtml = '<span class="text-2xl">⏳</span>';
                let statusText = 'در انتظار تایید';
                let statusColor = 'text-amber-400';

                const currentPrice = parseFloat(item.price);
                const pocPrice = parseFloat(adv.poc);
                const liqTarget = parseFloat(adv.liqTarget.replace('تا $', ''));
                const atrValue = parseFloat(adv.atr) || (currentPrice * 0.01);
                
                // 🎯 منطق ICT: تعریف سطوح کلیدی ساختاری
                // سطح مقاومت: بالاترین قیمت بین POC و هدف لیکوییدیشن به علاوه نیمی از ATR
                const resistanceLevel = Math.max(pocPrice, liqTarget) + atrValue * 0.5;
                // سطح حمایت: پایین‌ترین قیمت بین POC و هدف لیکوییدیشن منهای نیمی از ATR
                const supportLevel = Math.min(pocPrice, liqTarget) - atrValue * 0.5;
                
                let entryPrice, slPrice, tpPrice, setupText, setupCondition;

                if (adv.verdict.includes('قوی') || adv.verdict.includes('خرید')) {
                    cardBorder = 'neon-border-green animate-pulse-green';
                    bgGradient = 'from-emerald-950/60 to-gray-900/90';
                    iconHtml = '<span class="text-3xl animate-bounce">📈</span>';
                    statusText = 'ستاپ خرید (Long)';
                    statusColor = 'text-emerald-400 glow-text-green';
                    
                    entryPrice = supportLevel.toFixed(4);
                    slPrice = (supportLevel - atrValue * 1.5).toFixed(4);
                    tpPrice = liqTarget.toFixed(4);
                    setupText = 'BUY LIMIT';
                    setupCondition = `منتظر رسیدن قیمت به حمایت ${entryPrice} و تایید کندل صعودی (MSS)`;
                } else if (adv.verdict.includes('فروش')) {
                    cardBorder = 'neon-border-red';
                    bgGradient = 'from-red-950/60 to-gray-900/90';
                    iconHtml = '<span class="text-3xl animate-bounce">📉</span>';
                    statusText = 'ستاپ فروش (Short)';
                    statusColor = 'text-red-400 glow-text-red';
                    
                    entryPrice = resistanceLevel.toFixed(4);
                    slPrice = (resistanceLevel + atrValue * 1.5).toFixed(4);
                    tpPrice = liqTarget.toFixed(4);
                    setupText = 'SELL LIMIT';
                    setupCondition = `منتظر رسیدن قیمت به مقاومت ${entryPrice} و تایید کندل نزولی (MSS)`;
                } else if (adv.verdict.includes('تله')) {
                    cardBorder = 'neon-border-red';
                    bgGradient = 'from-orange-950/60 to-gray-900/90';
                    iconHtml = '<span class="text-3xl animate-pulse">⚠️</span>';
                    statusText = 'تله (خطر)';
                    statusColor = 'text-orange-400 font-bold';
                    
                    entryPrice = '—';
                    slPrice = '—';
                    tpPrice = '—';
                    setupText = 'NO TRADE';
                    setupCondition = 'وضعیت تله است؛ ورود در این ناحیه ممنوع می‌باشد.';
                } else {
                    // حالت انتظار: سطوح بر اساس POC و ATR
                    entryPrice = pocPrice.toFixed(4);
                    slPrice = (pocPrice - atrValue * 1.5).toFixed(4);
                    tpPrice = (pocPrice + atrValue * 3).toFixed(4);
                    setupText = 'WAIT';
                    setupCondition = 'داده‌ها اجماع کافی ندارند؛ در انتظار تشکیل ستاپ معتبر بمانید.';
                }

                const takerPercent = Math.min(Math.max(adv.takerRatio, 0), 100);
                const sellerPercent = 100 - takerPercent;
                const buyerBarColor = takerPercent > 50 ? 'bg-emerald-500' : 'bg-gray-500';

                let gaugeColor = 'stroke-amber-500';
                if (displayScore >= 70) gaugeColor = 'stroke-emerald-500';
                else if (displayScore < 40) gaugeColor = 'stroke-red-500';

                let rankColor = 'bg-gray-700 text-gray-300';
                if (rank === 1) rankColor = 'bg-gradient-to-r from-yellow-400 to-yellow-600 text-black shadow-lg shadow-yellow-500/50';
                else if (rank === 2) rankColor = 'bg-gradient-to-r from-gray-300 to-gray-400 text-black';
                else if (rank === 3) rankColor = 'bg-gradient-to-r from-amber-600 to-amber-700 text-white';

                container.innerHTML += `
                    <div class="glass-panel rounded-2xl p-5 relative overflow-hidden ${cardBorder} transition-all duration-300">
                        <div class="absolute inset-0 bg-gradient-to-b ${bgGradient}"></div>
                        
                        <!-- هدر کارت -->
                        <div class="relative z-10 flex justify-between items-start mb-4">
                            <div>
                                <div class="flex items-center gap-2">
                                    <span class="text-xs font-black px-2 py-1 rounded-lg ${rankColor}">#${rank}</span>
                                    <h2 class="text-3xl font-black text-white tracking-tight">${item.symbol}</h2>
                                </div>
                                <div class="text-xs text-gray-400 mt-2 font-bold font-mono">قیمت فعلی: ${item.price}</div>
                                <div class="text-xs text-gray-500 mt-1 font-bold">همسویی: ${adv.trend1h} (1H) | ${adv.trend4h} (4H)</div>
                            </div>
                            <div class="flex flex-col items-center">
                                ${iconHtml}
                                <span class="text-xs font-black mt-1 ${statusColor}">${statusText}</span>
                            </div>
                        </div>

                        <!-- امتیاز اجماع -->
                        <div class="relative z-10 flex items-center gap-4 bg-gray-900/50 p-3 rounded-xl border border-gray-700/50 mb-4">
                            <div class="relative w-14 h-14 flex-shrink-0">
                                <svg class="w-full h-full transform -rotate-90" viewBox="0 0 36 36">
                                    <path class="text-gray-800" stroke-width="4" stroke="currentColor" fill="none" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                                    <path class="${gaugeColor} drop-shadow-lg" stroke-width="4" stroke-dasharray="${displayScore}, 100" stroke-linecap="round" stroke="currentColor" fill="none" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                                </svg>
                                <div class="absolute inset-0 flex items-center justify-center">
                                    <span class="text-sm font-black text-white">${displayScore}</span>
                                </div>
                            </div>
                            <div class="flex-1">
                                <div class="text-xs font-bold text-gray-300 mb-1">امتیاز کیفیت ستاپ (اجماع)</div>
                                <div class="text-[10px] text-gray-500 leading-tight">ترکیب روند، تیکر، نهنگ، اوردر بلاک و OTE.</div>
                            </div>
                        </div>

                        <!-- نوار قدرت -->
                        <div class="relative z-10 mb-4">
                            <div class="flex justify-between text-[10px] font-bold mb-1">
                                <span class="text-emerald-400">خریدار: ${takerPercent}%</span>
                                <span class="text-red-400">فروشنده: ${sellerPercent}%</span>
                            </div>
                            <div class="w-full bg-gray-800 rounded-full h-3 overflow-hidden border border-gray-700">
                                <div class="${buyerBarColor} h-full transition-all duration-1000" style="width: ${takerPercent}%"></div>
                            </div>
                            <div class="text-[9px] text-center text-gray-500 mt-1 font-bold">تیکر: ${adv.takerRatio}% | نهنگ: ${adv.topTrader}%</div>
                        </div>

                        <!-- 🟢 سطوح شرطی (ICT Limit Orders) -->
                        <div class="relative z-10 bg-gray-950/80 border border-blue-500/30 rounded-xl p-3 mb-4">
                            <div class="flex justify-between items-center mb-2">
                                <span class="text-xs font-black text-blue-300">⚡ ${setupText}</span>
                                <span class="text-[10px] text-gray-400 font-mono">${item.symbol}</span>
                            </div>
                            <div class="text-[11px] text-gray-300 leading-relaxed font-bold mb-3">
                                ${setupCondition}
                            </div>
                            
                            <div class="grid grid-cols-3 gap-2 text-center">
                                <div class="bg-blue-950/60 border border-blue-500/40 rounded-lg p-2">
                                    <div class="text-[9px] text-blue-300 font-bold mb-1">📍 ورود (Entry)</div>
                                    <div class="text-sm font-mono font-black text-white">${entryPrice}</div>
                                </div>
                                <div class="bg-red-950/60 border border-red-500/40 rounded-lg p-2">
                                    <div class="text-[9px] text-red-300 font-bold mb-1">🛑 حد ضرر (SL)</div>
                                    <div class="text-sm font-mono font-black text-white">${slPrice}</div>
                                </div>
                                <div class="bg-emerald-950/60 border border-emerald-500/40 rounded-lg p-2">
                                    <div class="text-[9px] text-emerald-300 font-bold mb-1">🎯 هدف (TP)</div>
                                    <div class="text-sm font-mono font-black text-white">${tpPrice}</div>
                                </div>
                            </div>
                        </div>

                        <div class="relative z-10 mt-2 bg-gray-900/90 border border-gray-700/50 rounded-lg p-2 text-xs flex justify-between items-center">
                            <div class="text-gray-300 leading-tight">
                                <span class="font-bold text-gray-400">وضعیت فعلی:</span> ${adv.verdict}
                            </div>
                            <div class="text-emerald-400 font-mono font-bold text-[11px]">
                                TP: ${adv.liqTarget.replace('تا $', '')}
                            </div>
                        </div>

                    </div>
                `;
            });
        }

        fetchAllData();
        startCountdown();
    </script>
</body>
</html>
