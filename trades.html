<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liquidity Hunter | داشبورد سیگنال‌ها</title>
    <style>
        :root {
            --bg-color: #131722;
            --card-bg: #1e222d;
            --text-main: #d1d4dc;
            --text-muted: #787b86;
            --green: #089981;
            --red: #f23645;
            --border: #2a2e39;
            
            --eng1-color: #2962ff;
            --eng2-color: #9c27b0;
            --eng3-color: #ff9800;
            
            --eng1-bg: rgba(41, 98, 255, 0.1);
            --eng2-bg: rgba(156, 39, 176, 0.1);
            --eng3-bg: rgba(255, 152, 0, 0.1);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
        }

        h1, h2, h3 { margin: 0; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid var(--border); padding-bottom: 15px; }
        .header h1 { font-size: 24px; color: #fff; }
        
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; margin-bottom: 20px; }
        .stat-card { background-color: var(--card-bg); padding: 15px; border-radius: 8px; border: 1px solid var(--border); text-align: center; }
        .stat-card .title { font-size: 13px; color: var(--text-muted); margin-bottom: 5px; }
        .stat-card .value { font-size: 20px; font-weight: bold; }
        
        .engine-stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-bottom: 30px; }
        .engine-card { background-color: var(--card-bg); padding: 15px; border-radius: 8px; border: 1px solid var(--border); text-align: center; position: relative; overflow: hidden; }
        .engine-card .eng-title { font-size: 16px; font-weight: bold; margin-bottom: 10px; }
        .engine-card .eng-row { display: flex; justify-content: space-between; margin-bottom: 5px; font-size: 14px; color: var(--text-muted); }
        .engine-card .eng-row b { color: var(--text-main); font-size: 15px; }
        
        .card-e1 { border-top: 3px solid var(--eng1-color); }
        .card-e2 { border-top: 3px solid var(--eng2-color); }
        .card-e3 { border-top: 3px solid var(--eng3-color); }

        .day-section { margin-bottom: 30px; }
        .day-header { display: flex; justify-content: space-between; align-items: center; background-color: var(--card-bg); padding: 10px 15px; border-radius: 8px 8px 0 0; border: 1px solid var(--border); border-bottom: none; }
        .day-header h3 { font-size: 16px; color: #fff; }
        
        table { width: 100%; border-collapse: collapse; background-color: var(--card-bg); border-radius: 0 0 8px 8px; overflow: hidden; border: 1px solid var(--border); }
        th, td { padding: 12px 10px; text-align: center; border-bottom: 1px solid var(--border); font-size: 13px; }
        th { background-color: #2a2e39; color: var(--text-muted); font-weight: normal; }
        tr:last-child td { border-bottom: none; }
        
        .row-eng1 { background-color: var(--eng1-bg); }
        .row-eng2 { background-color: var(--eng2-bg); }
        .row-eng3 { background-color: var(--eng3-bg); }
        
        .eng-badge { font-size: 10px; padding: 2px 5px; border-radius: 3px; color: #fff; margin-right: 5px; }
        .eng1-badge { background-color: var(--eng1-color); }
        .eng2-badge { background-color: var(--eng2-color); }
        .eng3-badge { background-color: var(--eng3-color); }

        .badge { padding: 4px 8px; border-radius: 4px; font-weight: bold; font-size: 12px; display: inline-block; }
        .badge-long { background-color: rgba(8, 153, 129, 0.2); color: var(--green); }
        .badge-short { background-color: rgba(242, 54, 69, 0.2); color: var(--red); }
        
        .profit { color: var(--green); font-weight: bold; }
        .loss { color: var(--red); font-weight: bold; }
        .neutral { color: var(--text-muted); }
        .time-cell { color: var(--text-muted); font-size: 12px; direction: ltr; }
        
        .footer-status { text-align: center; margin-top: 20px; padding: 15px; background-color: var(--card-bg); border-radius: 8px; border: 1px solid var(--border); font-size: 14px; }
        .loading { text-align: center; font-size: 18px; color: var(--text-muted); margin-top: 50px; }

        @media (max-width: 768px) {
            .engine-stats-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>⚡ Liquidity Hunter | داشبورد سیگنال‌ها</h1>
        <div id="last-update" style="color: var(--text-muted); font-size: 12px;">در حال بارگذاری...</div>
    </div>

    <div class="stats-grid" id="stats-grid"></div>
    <div class="engine-stats-grid" id="engine-stats-grid"></div>

    <div id="tables-container">
        <div class="loading">⏳ در حال دریافت اطلاعات...</div>
    </div>

    <div class="footer-status" id="footer-status">
        در حال محاسبه آخرین وضعیت...
    </div>

    <script>
        async function fetchData() {
            try {
                const response = await fetch('/api/stats');
                const data = await response.json();

                if (!data.ok) throw new Error("API Error");

                renderDashboard(data.trades);
                document.getElementById('last-update').innerText = "آخرین بروزرسانی: " + new Date().toLocaleTimeString('fa-IR');
            } catch (error) {
                console.error("Fetch error:", error);
                document.getElementById('tables-container').innerHTML = `<div class="loading" style="color:var(--red)">❌ خطا در ارتباط با سرور</div>`;
            }
        }

        function formatTime(ts) {
            if (!ts) return "—";
            const date = new Date(ts);
            return date.toLocaleTimeString('fa-IR', { hour: '2-digit', minute: '2-digit' });
        }

        function renderDashboard(trades) {
            const container = document.getElementById('tables-container');
            const statsGrid = document.getElementById('stats-grid');
            const engineStatsGrid = document.getElementById('engine-stats-grid');
            container.innerHTML = '';

            if (trades.length === 0) {
                container.innerHTML = '<div class="loading">هیچ معامله‌ای در ۱۰ روز اخیر ثبت نشده است.</div>';
                return;
            }

            const todayStr = new Date().toLocaleDateString('en-CA');
            const grouped = {};
            
            let totalProfitPct10d = 0, wins10d = 0, validCount10d = 0;
            let totalProfitPctToday = 0, winsToday = 0, validCountToday = 0;
            
            let engines = {
                "ENGINE_1_SMC": { n: 0, wins: 0, pct: 0, name: "🎯 موتور ۱ (SMC)" },
                "ENGINE_2_MTF_V8": { n: 0, wins: 0, pct: 0, name: "⚙️ موتور ۲ (MTF)" },
                "ENGINE_3_TRENDLINE": { n: 0, wins: 0, pct: 0, name: "📈 موتور ۳ (Trendline)" }
            };

            trades.forEach(t => {
                const dateObj = new Date(t.sentAt || t.closedAt || Date.now());
                const dateKey = dateObj.toLocaleDateString('en-CA'); 
                
                if (!grouped[dateKey]) grouped[dateKey] = [];
                grouped[dateKey].push(t);

                if (t.status !== "OPEN" && t.entry && t.exitPrice) {
                    const pct = ((t.exitPrice - t.entry) / t.entry) * 100 * (t.side === "LONG" ? 1 : -1);
                    
                    totalProfitPct10d += pct;
                    if (pct > 0) wins10d++;
                    validCount10d++;

                    if (dateKey === todayStr) {
                        totalProfitPctToday += pct;
                        if (pct > 0) winsToday++;
                        validCountToday++;
                    }

                    if (engines[t.engine]) {
                        engines[t.engine].n++;
                        engines[t.engine].pct += pct;
                        if (pct > 0) engines[t.engine].wins++;
                    }
                }
            });

            const winRate10d = validCount10d > 0 ? (wins10d / validCount10d * 100).toFixed(1) : 0;
            const winRateToday = validCountToday > 0 ? (winsToday / validCountToday * 100).toFixed(1) : 0;

            statsGrid.innerHTML = `
                <div class="stat-card">
                    <div class="title">سود کل (۱۰ روز)</div>
                    <div class="value ${totalProfitPct10d >= 0 ? 'profit' : 'loss'}">${totalProfitPct10d >= 0 ? '+' : ''}${totalProfitPct10d.toFixed(2)}%</div>
                </div>
                <div class="stat-card">
                    <div class="title">وین‌ریت (۱۰ روز)</div>
                    <div class="value">${winRate10d}%</div>
                </div>
                <div class="stat-card">
                    <div class="title">کل معاملات (۱۰ روز)</div>
                    <div class="value">${validCount10d}</div>
                </div>
                <div class="stat-card" style="border-color: var(--green);">
                    <div class="title" style="color: var(--green);">سود امروز</div>
                    <div class="value ${totalProfitPctToday >= 0 ? 'profit' : 'loss'}">${totalProfitPctToday >= 0 ? '+' : ''}${totalProfitPctToday.toFixed(2)}%</div>
                </div>
                <div class="stat-card" style="border-color: var(--green);">
                    <div class="title" style="color: var(--green);">وین‌ریت امروز</div>
                    <div class="value">${winRateToday}%</div>
                </div>
                <div class="stat-card" style="border-color: var(--green);">
                    <div class="title" style="color: var(--green);">معاملات امروز</div>
                    <div class="value">${validCountToday}</div>
                </div>
            `;

            let engHtml = '';
            const engKeys = ["ENGINE_1_SMC", "ENGINE_2_MTF_V8", "ENGINE_3_TRENDLINE"];
            
            engKeys.forEach((key, idx) => {
                const e = engines[key];
                const wr = e.n > 0 ? ((e.wins / e.n) * 100).toFixed(1) : 0;
                const pClass = e.pct >= 0 ? 'profit' : 'loss';
                const pSign = e.pct >= 0 ? '+' : '';
                const colorClass = idx === 0 ? 'eng1-color' : idx === 1 ? 'eng2-color' : 'eng3-color';
                
                engHtml += `
                    <div class="engine-card card-e${idx+1}">
                        <div class="eng-title ${colorClass}">${e.name}</div>
                        <div class="eng-row"><span>تعداد معاملات:</span> <b>${e.n}</b></div>
                        <div class="eng-row"><span>وین‌ریت:</span> <b>${wr}%</b></div>
                        <div class="eng-row"><span>مجموع سود:</span> <b class="${pClass}">${pSign}${e.pct.toFixed(2)}%</b></div>
                    </div>
                `;
            });
            engineStatsGrid.innerHTML = engHtml;

            const sortedDates = Object.keys(grouped).sort((a, b) => new Date(b) - new Date(a));

            sortedDates.forEach((dateKey, index) => {
                const dayTrades = grouped[dateKey];
                
                let dayProfit = 0;
                dayTrades.forEach(t => {
                    if (t.status !== "OPEN" && t.entry && t.exitPrice) {
                        dayProfit += ((t.exitPrice - t.entry) / t.entry) * 100 * (t.side === "LONG" ? 1 : -1);
                    }
                });

                // اصلاح عنوان روزها به صورت داینامیک تا ۱۰ روز
                let dayTitle = "";
                if (index === 0) {
                    dayTitle = "امروز";
                } else if (index === 1) {
                    dayTitle = "دیروز";
                } else {
                    const persianNumbers = ["۰", "۱", "۲", "۳", "۴", "۵", "۶", "۷", "۸", "۹"];
                    const numStr = String(index).replace(/\d/g, d => persianNumbers[d]);
                    dayTitle = `${numStr} روز پیش`;
                }

                const persianDate = new Date(dateKey).toLocaleDateString('fa-IR');

                let rowsHtml = '';
                dayTrades.forEach(t => {
                    const sideClass = t.side === "LONG" ? "badge-long" : "badge-short";
                    const sideText = t.side === "LONG" ? "🟢 خرید" : "🔴 فروش";
                    
                    let rowClass = '';
                    let engBadge = '';
                    if (t.engine === "ENGINE_1_SMC") {
                        rowClass = 'row-eng1';
                        engBadge = '<span class="eng-badge eng1-badge">E1</span>';
                    } else if (t.engine === "ENGINE_2_MTF_V8") {
                        rowClass = 'row-eng2';
                        engBadge = '<span class="eng-badge eng2-badge">E2</span>';
                    } else if (t.engine === "ENGINE_3_TRENDLINE") {
                        rowClass = 'row-eng3';
                        engBadge = '<span class="eng-badge eng3-badge">E3</span>';
                    }

                    let statusHtml = '';
                    let closeTimeText = '—';

                    if (t.status === "OPEN") {
                        const pnl = t.livePnlPct !== undefined ? t.livePnlPct : 0;
                        const pClass = pnl >= 0 ? 'profit' : 'loss';
                        const pSign = pnl >= 0 ? '+' : '';
                        statusHtml = `<span class="${pClass}">⏳ در جریان (${pSign}${pnl.toFixed(2)}%)</span>`;
                        closeTimeText = `معامله باز`;
                    } else {
                        let pct = ((t.exitPrice - t.entry) / t.entry) * 100 * (t.side === "LONG" ? 1 : -1);
                        const pClass = pct >= 0 ? 'profit' : 'loss';
                        statusHtml = `<span class="${pClass}">${pct >= 0 ? '+' : ''}${pct.toFixed(2)}% (بسته شد)</span>`;
                        closeTimeText = formatTime(t.closedAt);
                    }

                    rowsHtml += `
                        <tr class="${rowClass}">
                            <td>#${t.signalId || '—'} ${engBadge}</td>
                            <td>${t.symbol}</td>
                            <td><span class="badge ${sideClass}">${sideText}</span></td>
                            <td class="time-cell">${formatTime(t.sentAt)}</td>
                            <td class="time-cell">${closeTimeText}</td>
                            <td>${t.entry ? t.entry.toFixed(6) : '—'}</td>
                            <td>${t.tp ? t.tp.toFixed(6) : '—'}</td>
                            <td>${t.sl ? t.sl.toFixed(6) : '—'}</td>
                            <td style="font-weight:bold;">${statusHtml}</td>
                        </tr>
                    `;
                });

                const profitClass = dayProfit >= 0 ? 'profit' : 'loss';
                const profitSign = dayProfit >= 0 ? '+' : '';

                container.innerHTML += `
                    <div class="day-section">
                        <div class="day-header">
                            <h3>🗓️ ${dayTitle} (${persianDate})</h3>
                            <span class="${profitClass}">مجموع سود: ${profitSign}${dayProfit.toFixed(2)}%</span>
                        </div>
                        <table>
                            <thead>
                                <tr>
                                    <th># / موتور</th>
                                    <th>ارز</th>
                                    <th>جهت</th>
                                    <th>ساعت ورود</th>
                                    <th>ساعت خروج</th>
                                    <th>ورود</th>
                                    <th>حد سود</th>
                                    <th>حد ضرر</th>
                                    <th>وضعیت (درصد)</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${rowsHtml}
                            </tbody>
                        </table>
                    </div>
                `;
            });

            const lastTrade = trades.find(t => t.status !== "OPEN");
            if (lastTrade) {
                const lastPct = ((lastTrade.exitPrice - lastTrade.entry) / lastTrade.entry) * 100 * (lastTrade.side === "LONG" ? 1 : -1);
                const statusText = lastPct >= 0 ? 'سود' : 'ضرر';
                const colorClass = lastPct >= 0 ? 'profit' : 'loss';
                document.getElementById('footer-status').innerHTML = `
                    آخرین معامله بسته‌شده (${lastTrade.symbol}) با <span class="${colorClass}">${statusText} (${lastPct >= 0 ? '+' : ''}${lastPct.toFixed(2)}%)</span> بسته شد.
                `;
            }
        }

        fetchData();
        setInterval(fetchData, 10000);
    </script>
</body>
</html>
