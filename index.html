<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liquidity Hunter Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700&display=swap');
        body { font-family: 'Vazirmatn', sans-serif; background-color: #0f172a; color: #f8fafc; }
    </style>
</head>
<body class="min-h-screen p-8">
    <div class="max-w-7xl mx-auto space-y-6">
        
        <!-- Header -->
        <div class="flex justify-between items-center">
            <h1 class="text-3xl font-bold text-blue-400">Liquidity Hunter Dashboard</h1>
            <div class="flex items-center gap-4">
                <span id="status-badge" class="px-4 py-2 rounded-full bg-gray-700 text-sm">در حال اتصال...</span>
                <button onclick="fetchAllData()" class="bg-blue-600 hover:bg-blue-700 px-4 py-2 rounded-lg text-sm transition">بروزرسانی</button>
            </div>
        </div>

        <!-- خلاصه وضعیت (Summary Cards) -->
        <div id="summary-section" class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <!-- کارت ۱: بهترین فرصت -->
            <div class="bg-gray-800 border border-gray-700 rounded-xl p-5 shadow-lg">
                <h3 class="text-gray-400 text-sm mb-2">🎯 بهترین فرصت فعلی</h3>
                <div id="summary-top-pick" class="text-xl font-bold">در حال محاسبه...</div>
            </div>
            <!-- کارت ۲: هشدار نهنگ‌ها -->
            <div class="bg-gray-800 border border-gray-700 rounded-xl p-5 shadow-lg">
                <h3 class="text-gray-400 text-sm mb-2">🐋 رادار پول هوشمند</h3>
                <div id="summary-whale" class="text-xl font-bold">در حال محاسبه...</div>
            </div>
            <!-- کارت ۳: وضعیت کلی بازار -->
            <div class="bg-gray-800 border border-gray-700 rounded-xl p-5 shadow-lg">
                <h3 class="text-gray-400 text-sm mb-2">📊 وضعیت کلی بازار</h3>
                <div id="summary-market" class="text-xl font-bold">در حال محاسبه...</div>
            </div>
        </div>

        <!-- جدول وضعیت بازار -->
        <div class="bg-gray-800 rounded-xl shadow-lg overflow-hidden border border-gray-700">
            <div class="p-6 border-b border-gray-700">
                <h2 class="text-xl font-bold">وضعیت لحظه‌ای بازار (تایم 15 دقیقه)</h2>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-right text-sm">
                    <thead class="bg-gray-900 text-gray-400">
                        <tr>
                            <th class="px-6 py-4">نماد</th>
                            <th class="px-6 py-4">قیمت</th>
                            <th class="px-6 py-4">قدرت (Strength)</th>
                            <th class="px-6 py-4">روند</th>
                            <th class="px-6 py-4">ساختار</th>
                            <th class="px-6 py-4">جریان سفارشات</th>
                            <th class="px-6 py-4">واگرایی (CVD)</th>
                            <th class="px-6 py-4">RSI</th>
                            <th class="px-6 py-4">وضعیت</th>
                            <th class="px-6 py-4">دلیل</th>
                        </tr>
                    </thead>
                    <tbody id="table-body" class="divide-y divide-gray-700"></tbody>
                </table>
            </div>
        </div>

    </div>

    <script>
        const API_MARKET = 'https://liquidity-bot-khaki.vercel.app/api/market-status';

        async function fetchAllData() {
            document.getElementById('status-badge').innerText = 'در حال آپدیت...';
            try {
                const res = await fetch(API_MARKET);
                const json = await res.json();
                if (json.ok) {
                    renderSummary(json.summary);
                    renderTable(json.data);
                    document.getElementById('status-badge').className = 'px-4 py-2 rounded-full bg-green-900 text-green-300 text-sm';
                    document.getElementById('status-badge').innerText = 'متصل';
                }
            } catch (e) {
                document.getElementById('status-badge').className = 'px-4 py-2 rounded-full bg-red-900 text-red-300 text-sm';
                document.getElementById('status-badge').innerText = 'خطا در اتصال';
            }
        }

        function renderSummary(summary) {
            const topPickEl = document.getElementById('summary-top-pick');
            if (summary.topPick) {
                let color = summary.topPick.status.includes('خرید') ? 'text-green-400' : (summary.topPick.status.includes('فروش') ? 'text-red-400' : 'text-yellow-400');
                topPickEl.innerHTML = `<span class="${color}">${summary.topPick.symbol} - ${summary.topPick.status}</span><div class="text-xs text-gray-400 mt-1 font-normal">${summary.topPick.reason}</div>`;
            } else {
                topPickEl.innerText = "فرصت واضحی نیست";
            }

            const whaleEl = document.getElementById('summary-whale');
            if (summary.whaleAlert) {
                whaleEl.innerHTML = `<span class="text-blue-400">${summary.whaleAlert.symbol}</span><div class="text-xs text-gray-400 mt-1 font-normal">${summary.whaleAlert.type}</div>`;
            } else {
                whaleEl.innerText = "فعالیت خاصی دیده نمی‌شود";
            }

            document.getElementById('summary-market').innerText = summary.marketCondition;
        }

        function renderTable(data) {
            const tbody = document.getElementById('table-body');
            tbody.innerHTML = '';
            data.forEach(item => {
                let statusColor = 'bg-gray-700 text-gray-300';
                if (item.status.includes('خرید')) statusColor = 'bg-green-900 text-green-300';
                else if (item.status.includes('فروش')) statusColor = 'bg-red-900 text-red-300';
                else if (item.status.includes('انتظار')) statusColor = 'bg-yellow-900 text-yellow-300';

                let trendIcon = item.trend === 'bull' ? '🟢 صعودی' : item.trend === 'bear' ? '🔴 نزولی' : '🟡 خنثی';
                
                // رنگ برای قدرت
                let strengthColor = item.strength > 60 ? 'text-green-400' : item.strength < 40 ? 'text-red-400' : 'text-yellow-400';

                tbody.innerHTML += `
                    <tr class="hover:bg-gray-750 transition">
                        <td class="px-6 py-4 font-bold">${item.symbol}</td>
                        <td class="px-6 py-4 font-mono">${item.price}</td>
                        <td class="px-6 py-4 font-bold ${strengthColor}">${item.strength}/100</td>
                        <td class="px-6 py-4">${trendIcon}</td>
                        <td class="px-6 py-4 text-gray-300">${item.structure}</td>
                        <td class="px-6 py-4">${item.confirmation}</td>
                        <td class="px-6 py-4 ${item.divergence.includes('⚠️') ? 'text-yellow-400 font-bold' : 'text-gray-400'}">${item.divergence}</td>
                        <td class="px-6 py-4">${item.rsi}</td>
                        <td class="px-6 py-4"><span class="px-3 py-1 rounded-full text-xs font-bold ${statusColor}">${item.status}</span></td>
                        <td class="px-6 py-4 text-gray-400 text-xs">${item.reason}</td>
                    </tr>
                `;
            });
        }

        fetchAllData();
        setInterval(fetchAllData, 30000);
    </script>
</body>
</html>
