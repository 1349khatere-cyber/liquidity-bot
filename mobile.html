<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Liquidity Hunter — Mobile</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;900&display=swap');
        body { font-family: 'Vazirmatn', sans-serif; background-color: #0b1120; color: #f8fafc; -webkit-tap-highlight-color: transparent; }
        .glass-panel { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .glow-text { text-shadow: 0 0 10px rgba(59, 130, 246, 0.5); }
        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="min-h-screen p-3 pb-10">
    <div class="max-w-md mx-auto space-y-4">
        
        <!-- هدر -->
        <div class="flex flex-col items-center justify-center glass-panel rounded-2xl p-4 shadow-2xl text-center relative overflow-hidden">
            <div class="absolute top-0 right-0 w-32 h-32 bg-blue-500/10 rounded-full blur-3xl"></div>
            <div class="w-12 h-12 rounded-xl bg-blue-600 flex items-center justify-center text-xl font-black text-white mb-2 shadow-lg">LH</div>
            <h1 class="text-2xl font-black text-white glow-text">Liquidity Hunter</h1>
            <p class="text-xs text-gray-400 mb-3 font-bold">میز معاملات حرفه‌ای (موبایل)</p>
            <div class="flex items-center gap-2 w-full">
                <span id="status-badge" class="flex-1 py-2.5 rounded-xl bg-gray-800 text-sm font-bold border border-gray-700">در حال اتصال...</span>
                <button onclick="manualRefresh()" class="flex-1 bg-blue-600 hover:bg-blue-500 py-2.5 rounded-xl text-sm font-bold transition shadow-lg">بروزرسانی</button>
            </div>
            <div id="countdown-text" class="text-xs text-emerald-400 mt-3 flex items-center justify-center gap-1 font-bold">
                <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                <span>به‌روزرسانی خودکار در 30 ثانیه</span>
            </div>
        </div>

        <!-- کارت‌های خلاصه -->
        <div class="grid grid-cols-2 gap-3">
            <div class="glass-panel rounded-xl p-3 shadow-lg flex flex-col justify-center">
                <h3 class="text-gray-400 text-xs font-bold mb-1">🎯 بهترین فرصت</h3>
                <div id="summary-top" class="text-sm font-black leading-tight">در حال محاسبه...</div>
            </div>
            <div class="glass-panel rounded-xl p-3 shadow-lg flex flex-col justify-center">
                <h3 class="text-gray-400 text-xs font-bold mb-1">⚖️ معامله‌گران برتر</h3>
                <div id="summary-toptrader" class="text-sm font-black leading-tight">در حال محاسبه...</div>
            </div>
            <div class="glass-panel rounded-xl p-3 shadow-lg flex flex-col justify-center">
                <h3 class="text-gray-400 text-xs font-bold mb-1">🐋 رادار نهنگ‌ها</h3>
                <div id="summary-whale" class="text-sm font-black leading-tight">در حال محاسبه...</div>
            </div>
            <div class="glass-panel rounded-xl p-3 shadow-lg flex flex-col justify-center">
                <h3 class="text-gray-400 text-xs font-bold mb-1">📊 رژیم بازار</h3>
                <div id="summary-market" class="text-sm font-black leading-tight">در حال محاسبه...</div>
            </div>
        </div>

        <!-- لیست کارت‌های ارزها -->
        <div id="cards-container" class="space-y-5">
            <!-- داده‌ها با جاوااسکریپت اینجا تزریق می‌شوند -->
        </div>

    </div>

    <script>
        const API_URL = 'https://liquidity-bot-khaki.vercel.app/api/market-status';
        let countdown = 30;
        let timerInterval = null;

        function startCountdown() {
            if (timerInterval) clearInterval(timerInterval);
            countdown = 30;
            updateCountdownUI();
            timerInterval = setInterval(() => {
                countdown--;
                updateCountdownUI();
                if (countdown <= 0) { fetchAllData(); countdown = 30; }
            }, 1000);
        }

        function updateCountdownUI() {
            const el = document.getElementById('countdown-text');
            if (el) {
                el.innerHTML = `<span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> به‌روزرسانی خودکار در ${countdown} ثانیه`;
            }
        }

        function manualRefresh() { fetchAllData(); startCountdown(); }

        async function fetchAllData() {
            const badge = document.getElementById('status-badge');
            badge.innerText = 'در حال بروزرسانی...';
            badge.className = 'flex-1 py-2.5 rounded-xl bg-gray-700 text-sm font-bold border border-gray-600 text-center';
            try {
                const res = await fetch(API_URL);
                const json = await res.json();
                if (json.ok) {
                    renderSummary(json.summary);
                    renderCards(json.data);
                    badge.className = 'flex-1 py-2.5 rounded-xl bg-emerald-900/50 text-emerald-300 text-sm font-bold border border-emerald-500/50 text-center';
                    badge.innerText = 'متصل (Live)';
                }
            } catch (e) {
                badge.className = 'flex-1 py-2.5 rounded-xl bg-red-900/50 text-red-300 text-sm font-bold border border-red-500/50 text-center';
                badge.innerText = 'خطا در اتصال';
            }
        }

        function renderSummary(summary) {
            const topEl = document.getElementById('summary-top');
            if (summary.topPick) {
                let c = summary.topPick.status.includes('خرید') ? 'text-emerald-400' : (summary.topPick.status.includes('فروش') ? 'text-red-400' : 'text-amber-400');
                topEl.innerHTML = `<span class="${c} text-base">${summary.topPick.symbol}</span><br><span class="text-xs">${summary.topPick.status}</span>`;
            }
            const ttEl = document.getElementById('summary-toptrader');
            if (summary.topTrader) ttEl.innerHTML = `<span class="text-purple-400 text-base">${summary.topTrader.symbol}</span><br><span class="text-xs">${summary.topTrader.ratio}% خرید</span>`;
            
            const whaleEl = document.getElementById('summary-whale');
            if (summary.whaleAlert) whaleEl.innerHTML = `<span class="text-amber-400 text-base">${summary.whaleAlert.symbol}</span><br><span class="text-xs">${summary.whaleAlert.type}</span>`;
            else whaleEl.innerText = "فعالیت خاصی نیست";

            const marketEl = document.getElementById('summary-market');
            marketEl.innerHTML = `<span class="text-xs">${summary.marketCondition}</span>`;
        }

        function renderCards(data) {
            const container = document.getElementById('cards-container');
            container.innerHTML = '';
            data.forEach(item => {
                const adv = item.advanced;
                
                // تعیین رنگ و آیکون حکم نهایی
                let verdictColor = 'bg-gray-800 text-gray-300 border-gray-700';
                let verdictIcon = '⏳';
                if (adv.verdict.includes('قوی')) { verdictColor = 'bg-emerald-950/80 text-emerald-300 border-emerald-700/50'; verdictIcon = '🟢'; }
                else if (adv.verdict.includes('تله')) { verdictColor = 'bg-red-950/80 text-red-400 border-red-700/50 font-bold animate-pulse'; verdictIcon = '⚠️'; }
                else if (adv.verdict.includes('انتظار')) { verdictColor = 'bg-amber-950/80 text-amber-300 border-amber-700/50'; verdictIcon = '⏳'; }

                const trendIcon = item.trend === 'bull' ? '🟢 صعودی' : (item.trend === 'bear' ? '🔴 نزولی' : '🟡 خنثی');
                const takerColor = adv.takerRatio > 55 ? 'text-emerald-400' : (adv.takerRatio < 45 ? 'text-red-400' : 'text-gray-300');
                const topTraderColor = adv.topTrader > 55 ? 'text-purple-400' : (adv.topTrader < 45 ? 'text-red-400' : 'text-gray-300');
                const adxColor = adv.adx > 30 ? 'text-emerald-400' : (adv.adx < 20 ? 'text-red-400' : 'text-amber-400');

                container.innerHTML += `
                    <div class="glass-panel rounded-xl p-4 shadow-xl border-t-4 ${adv.verdict.includes('قوی') ? 'border-t-emerald-500' : (adv.verdict.includes('تله') ? 'border-t-red-500' : 'border-t-gray-500')}">
                        
                        <!-- هدر کارت -->
                        <div class="flex justify-between items-center border-b border-gray-600/50 pb-3 mb-3">
                            <div>
                                <div class="font-black text-white text-2xl">${item.symbol}</div>
                                <div class="font-mono text-sm text-blue-400 font-bold mt-1">${item.price}</div>
                            </div>
                            <div class="text-center">
                                <div class="text-xs text-gray-300 font-bold">${trendIcon}</div>
                                <div class="text-xs text-gray-400 mt-1 font-bold">همسویی: ${adv.trend1h} ${adv.trend4h}</div>
                            </div>
                            <div class="px-3 py-2 rounded-lg border ${verdictColor} text-sm font-black flex items-center gap-1 shadow-sm">
                                ${verdictIcon} ${adv.verdict}
                            </div>
                        </div>

                        <!-- ۳ فاکتور اصلی -->
                        <div class="grid grid-cols-3 gap-2 mb-4 text-center">
                            <div class="bg-gray-800 rounded-lg p-2 border border-gray-700 flex flex-col justify-center">
                                <div class="text-[10px] text-gray-400 mb-1 font-bold">تیکر (خرد)</div>
                                <div class="font-black text-base ${takerColor}">${adv.takerRatio}%</div>
                            </div>
                            <div class="bg-gray-800 rounded-lg p-2 border border-gray-700 flex flex-col justify-center">
                                <div class="text-[10px] text-gray-400 mb-1 font-bold">برتر (نهنگ)</div>
                                <div class="font-black text-base ${topTraderColor}">${adv.topTrader}%</div>
                            </div>
                            <div class="bg-gray-800 rounded-lg p-2 border border-gray-700 flex flex-col justify-center">
                                <div class="text-[10px] text-gray-400 mb-1 font-bold">ADX</div>
                                <div class="font-black text-base ${adxColor}">${adv.adx}</div>
                                <div class="text-[9px] text-gray-500 font-normal mt-0.5">قدرت روند</div>
                            </div>
                        </div>

                        <!-- لیست تمام موارد (فونت بزرگ و خوانا) -->
                        <div class="space-y-2 text-sm">
                            <div class="flex justify-between border-b border-gray-700/50 pb-1.5 items-center">
                                <span class="text-gray-400">موقعیت (ساختار):</span>
                                <span class="font-bold text-gray-200">${item.structure}</span>
                            </div>
                            <div class="flex justify-between border-b border-gray-700/50 pb-1.5 items-center">
                                <span class="text-gray-400">واگرایی OI:</span>
                                <span class="font-bold ${adv.oiDivergence.includes('⚠️') ? 'text-amber-400' : 'text-gray-200'}">${adv.oiDivergence}</span>
                            </div>
                            <div class="flex justify-between border-b border-gray-700/50 pb-1.5 items-center">
                                <span class="text-gray-400">OTE (فیبو):</span>
                                <span class="font-bold ${adv.isOTE.includes('بله') ? 'text-emerald-400' : 'text-gray-400'}">${adv.isOTE}</span>
                            </div>
                            <div class="flex justify-between border-b border-gray-700/50 pb-1.5 items-center">
                                <span class="text-gray-400">اوردر بلاک:</span>
                                <span class="font-bold ${adv.hasOB.includes('تایید') ? 'text-emerald-400' : 'text-gray-400'}">${adv.hasOB}</span>
                            </div>
                            <div class="flex justify-between border-b border-gray-700/50 pb-1.5 items-center">
                                <span class="text-gray-400">جریان سمی:</span>
                                <span class="font-bold ${adv.isToxic.includes('جذب') ? 'text-amber-400' : 'text-gray-400'}">${adv.isToxic}</span>
                            </div>
                            <div class="flex justify-between border-b border-gray-700/50 pb-1.5 items-center">
                                <span class="text-gray-400">CVD <span class="text-[10px] text-gray-500">(فشار خالص)</span>:</span>
                                <span class="font-bold ${adv.cvd > 0 ? 'text-emerald-400' : 'text-red-400'}">${adv.cvd > 0 ? '🟢 +' : '🔴 '}${adv.cvd}k</span>
                            </div>
                            <div class="flex justify-between border-b border-gray-700/50 pb-1.5 items-center">
                                <span class="text-gray-400">دیوار نهنگ:</span>
                                <span class="font-bold text-gray-200">${adv.whaleWall}</span>
                            </div>
                            <div class="flex justify-between border-b border-gray-700/50 pb-1.5 items-center">
                                <span class="text-gray-400">فاندینگ/OI:</span>
                                <span class="font-bold font-mono text-gray-200">FR: ${adv.fundingRate} <span class="text-gray-500 mx-1">|</span> OI: ${adv.oiDelta}</span>
                            </div>
                            <div class="flex justify-between border-b border-gray-700/50 pb-1.5 items-center">
                                <span class="text-gray-400">POC / فاصله:</span>
                                <span class="font-bold font-mono text-purple-300">${adv.poc} <span class="text-gray-500 text-xs">(${adv.distToPoc})</span></span>
                            </div>
                            <div class="flex justify-between border-b border-gray-700/50 pb-1.5 bg-amber-900/20 px-2 py-1 rounded items-center">
                                <span class="text-amber-500 font-bold">لیکوییدیشن / هدف:</span>
                                <span class="font-bold text-amber-300 font-mono text-xs text-left">${adv.liqZone} <br> ${adv.liqTarget}</span>
                            </div>
                        </div>

                        <!-- فوتر کارت -->
                        <div class="mt-3 bg-gray-900 rounded-lg p-3 text-xs flex flex-col gap-2">
                            <div class="text-gray-300 leading-relaxed font-medium">
                                <span class="text-gray-500 font-bold">دلیل ربات:</span> ${item.reason}
                            </div>
                            <div class="flex justify-between items-center border-t border-gray-700 pt-2">
                                <span class="text-gray-500 font-bold">وضعیت:</span>
                                <span class="px-2 py-1 rounded-lg text-xs font-bold ${item.status.includes('خرید') ? 'bg-emerald-950 text-emerald-300' : (item.status.includes('فروش') ? 'bg-red-950 text-red-300' : 'bg-amber-950 text-amber-300')}">${item.status}</span>
                                <span class="text-emerald-400 font-mono font-black bg-emerald-900/30 px-2 py-1 rounded border border-emerald-800/50">ریسک: ${adv.kellyRisk}</span>
                            </div>
                        </div>

                    </div>
                `;
            });
        }

        fetchAllData();
        startCountdown();
    </script>
</body>
</html>
