<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Liquidity Hunter — Mobile</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;900&display=swap');
        body { font-family: 'Vazirmatn', sans-serif; background-color: #0b1120; color: #f8fafc; -webkit-tap-highlight-color: transparent; }
        .glass-panel { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .glow-text { text-shadow: 0 0 10px rgba(59, 130, 246, 0.5); }
        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="min-h-screen p-4 pb-10">
    <div class="max-w-md mx-auto space-y-4">
        
        <!-- هدر -->
        <div class="flex flex-col items-center justify-center glass-panel rounded-2xl p-4 shadow-2xl text-center relative overflow-hidden">
            <div class="absolute top-0 right-0 w-32 h-32 bg-blue-500/10 rounded-full blur-3xl"></div>
            <div class="w-12 h-12 rounded-xl bg-blue-600 flex items-center justify-center text-xl font-black text-white mb-2 shadow-lg">LH</div>
            <h1 class="text-xl font-black text-white glow-text">Liquidity Hunter</h1>
            <p class="text-[10px] text-gray-400 mb-3">میز معاملات حرفه‌ای (نسخه موبایل)</p>
            <div class="flex items-center gap-2 w-full">
                <span id="status-badge" class="flex-1 py-2 rounded-xl bg-gray-800 text-xs font-medium border border-gray-700">در حال اتصال...</span>
                <button onclick="manualRefresh()" class="flex-1 bg-blue-600 hover:bg-blue-500 py-2 rounded-xl text-xs font-bold transition shadow-lg">بروزرسانی زنده</button>
            </div>
            <div id="countdown-text" class="text-[10px] text-emerald-400 mt-2 flex items-center justify-center gap-1">
                <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span>
                <span>به‌روزرسانی خودکار در 30 ثانیه</span>
            </div>
        </div>

        <!-- کارت‌های خلاصه -->
        <div class="grid grid-cols-2 gap-3">
            <div class="glass-panel rounded-xl p-3 shadow-lg">
                <h3 class="text-gray-400 text-[10px] font-bold mb-1">🎯 بهترین فرصت</h3>
                <div id="summary-top" class="text-[11px] font-black leading-tight">در حال محاسبه...</div>
            </div>
            <div class="glass-panel rounded-xl p-3 shadow-lg">
                <h3 class="text-gray-400 text-[10px] font-bold mb-1">⚖️ معامله‌گران برتر</h3>
                <div id="summary-toptrader" class="text-[11px] font-black leading-tight">در حال محاسبه...</div>
            </div>
            <div class="glass-panel rounded-xl p-3 shadow-lg">
                <h3 class="text-gray-400 text-[10px] font-bold mb-1">🐋 رادار نهنگ‌ها</h3>
                <div id="summary-whale" class="text-[11px] font-black leading-tight">در حال محاسبه...</div>
            </div>
            <div class="glass-panel rounded-xl p-3 shadow-lg">
                <h3 class="text-gray-400 text-[10px] font-bold mb-1">📊 رژیم بازار</h3>
                <div id="summary-market" class="text-[11px] font-black leading-tight">در حال محاسبه...</div>
            </div>
        </div>

        <!-- لیست کارت‌های ارزها -->
        <div id="cards-container" class="space-y-4">
            <!-- داده‌ها با جاوااسکریپت اینجا تزریق می‌شوند -->
        </div>

    </div>

    <script>
        const API_URL = 'https://liquidity-bot-khaki.vercel.app/api/market-status';
        let countdown = 30;
        let timerInterval = null;

        function startCountdown() {
            if (timerInterval) clearInterval(timerInterval);
            countdown = 30;
            updateCountdownUI();
            timerInterval = setInterval(() => {
                countdown--;
                updateCountdownUI();
                if (countdown <= 0) { fetchAllData(); countdown = 30; }
            }, 1000);
        }

        function updateCountdownUI() {
            const el = document.getElementById('countdown-text');
            if (el) {
                el.innerHTML = `<span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span> به‌روزرسانی خودکار در ${countdown} ثانیه`;
            }
        }

        function manualRefresh() { fetchAllData(); startCountdown(); }

        async function fetchAllData() {
            const badge = document.getElementById('status-badge');
            badge.innerText = 'در حال بروزرسانی...';
            badge.className = 'flex-1 py-2 rounded-xl bg-gray-700 text-xs font-medium border border-gray-600 text-center';
            try {
                const res = await fetch(API_URL);
                const json = await res.json();
                if (json.ok) {
                    renderSummary(json.summary);
                    renderCards(json.data);
                    badge.className = 'flex-1 py-2 rounded-xl bg-emerald-900/50 text-emerald-300 text-xs font-bold border border-emerald-500/50 text-center';
                    badge.innerText = 'متصل (Live)';
                }
            } catch (e) {
                badge.className = 'flex-1 py-2 rounded-xl bg-red-900/50 text-red-300 text-xs font-bold border border-red-500/50 text-center';
                badge.innerText = 'خطا در اتصال';
            }
        }

        function renderSummary(summary) {
            const topEl = document.getElementById('summary-top');
            if (summary.topPick) {
                let c = summary.topPick.status.includes('خرید') ? 'text-emerald-400' : (summary.topPick.status.includes('فروش') ? 'text-red-400' : 'text-amber-400');
                topEl.innerHTML = `<span class="${c}">${summary.topPick.symbol}</span><br>${summary.topPick.status}`;
            }
            const ttEl = document.getElementById('summary-toptrader');
            if (summary.topTrader) ttEl.innerHTML = `<span class="text-purple-400">${summary.topTrader.symbol}</span><br>${summary.topTrader.ratio}% خرید`;
            
            const whaleEl = document.getElementById('summary-whale');
            if (summary.whaleAlert) whaleEl.innerHTML = `<span class="text-amber-400">${summary.whaleAlert.symbol}</span><br>${summary.whaleAlert.type}`;
            else whaleEl.innerText = "فعالیت خاصی نیست";

            const marketEl = document.getElementById('summary-market');
            marketEl.innerHTML = `<span class="text-[10px]">${summary.marketCondition}</span>`;
        }

        function renderCards(data) {
            const container = document.getElementById('cards-container');
            container.innerHTML = '';
            data.forEach(item => {
                const adv = item.advanced;
                
                let verdictColor = 'bg-gray-800 text-gray-300 border-gray-700';
                let verdictIcon = '⏳';
                if (adv.verdict.includes('قوی')) { verdictColor = 'bg-emerald-950/80 text-emerald-300 border-emerald-700/50'; verdictIcon = '🟢'; }
                else if (adv.verdict.includes('تله')) { verdictColor = 'bg-red-950/80 text-red-400 border-red-700/50 font-bold animate-pulse'; verdictIcon = '⚠️'; }
                else if (adv.verdict.includes('انتظار')) { verdictColor = 'bg-amber-950/80 text-amber-300 border-amber-700/50'; verdictIcon = '⏳'; }

                const trendIcon = item.trend === 'bull' ? '🟢 صعودی' : (item.trend === 'bear' ? '🔴 نزولی' : '🟡 خنثی');
                const takerColor = adv.takerRatio > 55 ? 'text-emerald-400' : (adv.takerRatio < 45 ? 'text-red-400' : 'text-gray-300');
                const topTraderColor = adv.topTrader > 55 ? 'text-purple-400' : (adv.topTrader < 45 ? 'text-red-400' : 'text-gray-300');
                const adxColor = adv.adx > 30 ? 'text-emerald-400' : (adv.adx < 20 ? 'text-red-400' : 'text-amber-400');

                container.innerHTML += `
                    <div class="glass-panel rounded-xl p-4 shadow-lg border-t-2 ${adv.verdict.includes('قوی') ? 'border-t-emerald-500' : (adv.verdict.includes('تله') ? 'border-t-red-500' : 'border-t-gray-600')}">
                        
                        <!-- هدر کارت -->
                        <div class="flex justify-between items-center border-b border-gray-700/50 pb-2 mb-3">
                            <div class="flex flex-col">
                                <span class="font-black text-white text-lg">${item.symbol}</span>
                                <span class="font-mono text-xs text-blue-400">${item.price}</span>
                            </div>
                            <div class="text-left">
                                <div class="text-[10px] text-gray-400">${trendIcon}</div>
                                <div class="text-[10px] text-gray-500 mt-1">${adv.trend1h} ${adv.trend4h}</div>
                            </div>
                            <div class="px-3 py-1 rounded-lg border ${verdictColor} text-xs font-bold flex items-center gap-1">
                                ${verdictIcon} ${adv.verdict}
                            </div>
                        </div>

                        <!-- اطلاعات اصلی -->
                        <div class="grid grid-cols-3 gap-2 mb-3 text-center text-xs">
                            <div class="bg-gray-800/50 rounded-lg p-2">
                                <div class="text-[9px] text-gray-400 mb-1">تیکر (خرد)</div>
                                <div class="font-bold ${takerColor}">${adv.takerRatio}%</div>
                            </div>
                            <div class="bg-gray-800/50 rounded-lg p-2">
                                <div class="text-[9px] text-gray-400 mb-1">برتر (نهنگ)</div>
                                <div class="font-bold ${topTraderColor}">${adv.topTrader}%</div>
                            </div>
                            <div class="bg-gray-800/50 rounded-lg p-2">
                                <div class="text-[9px] text-gray-400 mb-1">ADX</div>
                                <div class="font-bold ${adxColor}">${adv.adx}</div>
                            </div>
                        </div>

                        <!-- جزئیات بیشتر -->
                        <div class="grid grid-cols-2 gap-x-2 gap-y-1 text-[10px] text-gray-300">
                            <div class="flex justify-between border-b border-gray-700/30 pb-1">
                                <span class="text-gray-500">موقعیت:</span>
                                <span>${item.structure}</span>
                            </div>
                            <div class="flex justify-between border-b border-gray-700/30 pb-1">
                                <span class="text-gray-500">واگرایی:</span>
                                <span class="${adv.oiDivergence.includes('⚠️') ? 'text-amber-400 font-bold' : ''}">${adv.oiDivergence}</span>
                            </div>
                            <div class="flex justify-between border-b border-gray-700/30 pb-1">
                                <span class="text-gray-500">OTE:</span>
                                <span class="${adv.isOTE.includes('بله') ? 'text-emerald-400' : 'text-gray-500'}">${adv.isOTE}</span>
                            </div>
                            <div class="flex justify-between border-b border-gray-700/30 pb-1">
                                <span class="text-gray-500">اوردر بلاک:</span>
                                <span class="${adv.hasOB.includes('تایید') ? 'text-emerald-400' : 'text-gray-500'}">${adv.hasOB}</span>
                            </div>
                            <div class="flex justify-between border-b border-gray-700/30 pb-1">
                                <span class="text-gray-500">جریان سمی:</span>
                                <span class="${adv.isToxic.includes('جذب') ? 'text-amber-400' : ''}">${adv.isToxic}</span>
                            </div>
                            <div class="flex justify-between border-b border-gray-700/30 pb-1">
                                <span class="text-gray-500">CVD:</span>
                                <span>${adv.cvd > 0 ? '🟢 +' : '🔴 '}${adv.cvd}k</span>
                            </div>
                            <div class="flex justify-between border-b border-gray-700/30 pb-1">
                                <span class="text-gray-500">POC:</span>
                                <span class="font-mono">${adv.poc} (${adv.distToPoc})</span>
                            </div>
                            <div class="flex justify-between border-b border-gray-700/30 pb-1">
                                <span class="text-gray-500">دیوار نهنگ:</span>
                                <span>${adv.whaleWall}</span>
                            </div>
                            <div class="flex justify-between border-b border-gray-700/30 pb-1 col-span-2">
                                <span class="text-amber-500 font-bold">لیکوییدیشن:</span>
                                <span class="text-amber-300 font-bold font-mono">${adv.liqZone} ${adv.liqTarget}</span>
                            </div>
                        </div>

                        <!-- فوتر کارت -->
                        <div class="mt-3 bg-gray-900/60 rounded-lg p-2 text-[10px] flex justify-between items-center">
                            <div class="text-gray-400 max-w-[70%] leading-tight">
                                <span class="font-bold text-gray-300">دلیل:</span> ${item.reason}
                            </div>
                            <div class="text-emerald-400 font-mono font-bold bg-emerald-950/30 px-2 py-1 rounded">
                                ریسک: ${adv.kellyRisk}
                            </div>
                        </div>

                    </div>
                `;
            });
        }

        fetchAllData();
        startCountdown();
    </script>
</body>
</html>
